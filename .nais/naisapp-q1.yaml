metadata:
  name: ereg-dolly-enheter-integrasjon-q1
spec:
  vault:
    paths:
      - kvPath: /oracle/data/dev/creds/enhetsregisteret_q1-user
        mountPath: /var/run/secrets/oracle_creds
      - kvPath: /oracle/data/dev/config/enhetsregisteret_q1
        mountPath: /var/run/secrets/oracle_config
  env:
    - name: AURA_ENVIRONMENT
      value: "q1"
