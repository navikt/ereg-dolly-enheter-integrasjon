metadata:
  name: ereg-dolly-enheter-integrasjon-q4
spec:
  vault:
    paths:
      - kvPath: /oracle/data/dev/creds/enhetsregisteret_q4-user
        mountPath: /var/run/secrets/oracle_creds
      - kvPath: /oracle/data/dev/config/enhetsregisteret_q4
        mountPath: /var/run/secrets/oracle_config
  env:
    - name: AURA_ENVIRONMENT
      value: "q4"
