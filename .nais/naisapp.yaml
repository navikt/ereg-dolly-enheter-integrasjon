apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  namespace: arbeidsforhold
  labels:
    team: arbeidsforhold
spec:
  azure:
    application:
      enabled: true
  replicas:
    max: 2
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
  accessPolicy:
    inbound:
      rules:
        - application: testnav-organisasjon-mottak-service
          namespace: dolly
  vault:
    enabled: true
  filesFrom:
    - secret: ereg-dolly-integrasjon-nais-token
      mountPath: /var/run/secrets/nais-api
  env:
    - name: NAIS_SERVICE_ACCOUNT_TOKEN_PATH
      value: /var/run/secrets/nais-api/NAIS_API_TOKEN
