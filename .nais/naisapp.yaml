apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  namespace: arbeidsforhold
  labels:
    team: arbeidsforhold
spec:
  azure:
    application:
      enabled: true
  replicas:
    max: 2
    min: 1
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
  accessPolicy:
    inbound:
      rules:
        - application: testnav-organisasjon-mottak-service
          namespace: dolly
        - application: testnav-dolly-proxy-trygdeetaten
          namespace: dolly
  vault:
    enabled: true
  env:
    - name: JDK_JAVA_OPTIONS
      value: $(JAVA_PROXY_OPTIONS)
  webproxy: true
