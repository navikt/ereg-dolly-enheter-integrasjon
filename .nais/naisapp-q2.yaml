metadata:
  name: ereg-dolly-enheter-integrasjon-q2
spec:
  vault:
    paths:
      - kvPath: /oracle/data/dev/creds/enhetsregisteret_q2-user
        mountPath: /var/run/secrets/oracle_creds
      - kvPath: /oracle/data/dev/config/enhetsregisteret_q2
        mountPath: /var/run/secrets/oracle_config
  env:
    - name: AURA_ENVIRONMENT
      value: "q2"
